<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2E96"/><stop offset=".55" stop-color="#071650"/><stop offset="1" stop-color="#050E38"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43C9FF"/><stop offset="1" stop-color="#1E66FF"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC042"/><stop offset="1" stop-color="#FF6A2B"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B477FF"/><stop offset="1" stop-color="#6A3BFF"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86EB7E"/><stop offset="1" stop-color="#1FA64E"/></linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="60" y1="400" x2="420" y2="140"><stop offset="0" stop-color="#2F7BFF"/><stop offset=".4" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".45" stop-color="#FFD27A" stop-opacity=".6"/><stop offset="1" stop-color="#FFB03B" stop-opacity="0"/></radialGradient>
    <clipPath id="sq"><rect x="40" y="40" width="432" height="432" rx="96"/></clipPath>
    <!-- nửa trước của vòng = nửa mặt phẳng phía dưới trục lớn (xoay -35°) -->
    <clipPath id="front"><rect x="-200" y="280" width="900" height="500" transform="rotate(-35 240 280)"/></clipPath>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <ellipse cx="240" cy="280" rx="230" ry="100" transform="rotate(-35 240 280)" fill="none" stroke="#1E4FE0" stroke-opacity=".55" stroke-width="12"/>
  </g>
  <rect x="160" y="166" width="90" height="90" rx="20" fill="url(#blue)"/>
  <rect x="262" y="166" width="90" height="90" rx="20" fill="url(#orange)"/>
  <rect x="160" y="268" width="90" height="90" rx="20" fill="url(#purple)"/>
  <rect x="262" y="268" width="90" height="90" rx="20" fill="url(#green)"/>
  <g clip-path="url(#sq)"><g clip-path="url(#front)">
    <ellipse cx="240" cy="280" rx="230" ry="100" transform="rotate(-35 240 280)" fill="none" stroke="url(#ring)" stroke-width="24"/>
  </g></g>
  <circle cx="397" cy="128" r="56" fill="url(#glow)"/>
  <circle cx="397" cy="128" r="20" fill="#FFF8E8"/>
</svg>
