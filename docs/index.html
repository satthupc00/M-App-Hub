<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <img class="brand-icon" src="icons/icon-192.png" alt="">
      <div class="brand-name"><span><span class="m">M</span> <span class="a">AppHub</span></span><span class="latest" id="latestBadge" hidden>latest</span></div>
    </div>
    <div class="tools">
      <button type="button" class="syncdot" id="dot" title="Chưa tải danh sách" aria-label="Trạng thái tải"><i></i></button>
      <label class="search" title="Tìm app (Ctrl+F)"><svg><use href="#i-search"/></svg><input id="q" placeholder="Tìm app… (Ctrl+F)" aria-label="Tìm app"></label>
      <button type="button" class="ibtn" id="btnReload" title="Tải lại danh sách từ GitHub (F5)" aria-label="Tải lại danh sách"><svg><use href="#i-cloud"/></svg></button>
      <button type="button" class="ibtn" id="btnSettings" title="Cài đặt" aria-label="Cài đặt"><svg><use href="#i-settings"/></svg></button>
      <button type="button" class="ibtn upd" id="btnUpd" title="Kiểm tra cập nhật" aria-label="Kiểm tra cập nhật"><svg><use href="#i-refresh"/></svg></button>
    </div>
  </header>

  <div class="mstrip" id="mstrip">
    <div class="msearch"><input id="mq" placeholder="Tìm app…" aria-label="Tìm app"><button type="button" class="ibtn" id="mqClose" aria-label="Đóng tìm"><svg><use href="#i-x"/></svg></button></div>
    <button type="button" class="syncdot" id="mdot" title="Chưa tải danh sách" aria-label="Trạng thái tải"><i></i></button>
    <button type="button" class="ibtn" id="mbtnSearch" title="Tìm" aria-label="Tìm app"><svg><use href="#i-search"/></svg></button>
    <button type="button" class="ibtn" id="mbtnReload" title="Tải lại danh sách" aria-label="Tải lại danh sách"><svg><use href="#i-cloud"/></svg></button>
    <button type="button" class="ibtn" id="mbtnSettings" title="Cài đặt" aria-label="Cài đặt"><svg><use href="#i-settings"/></svg></button>
    <span class="latest" id="mlatestBadge" hidden>latest</span>
    <button type="button" class="ibtn upd" id="mbtnUpd" title="Kiểm tra cập nhật" aria-label="Kiểm tra cập nhật"><svg><use href="#i-refresh"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="body">
    <nav class="side" id="side" aria-label="Nhóm"></nav>
    <main class="main" id="main"></main>
  </div>

  <footer class="foot"><span id="stat"></span><span class="hint">Kéo để sắp xếp · chuột phải để đổi nhóm, sửa mô tả hoặc ẩn</span><span class="credit">Created by Mondiro</span></footer>

</div>
